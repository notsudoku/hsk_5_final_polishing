<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HSK5 — 阅读(1)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .counter {
            font-size: 1.2em;
            margin-top: 10px;
            opacity: 0.9;
        }

        .card-container {
            -webkit-perspective: 1000px;
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            width: 100%;
            height: 420px;
            position: relative;
            transition: transform 0.6s ease;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background: white;
            z-index: 2;
            -webkit-transform: rotateY(0deg);
            transform: rotateY(0deg);
        }

        .card-back {
            background: #1e293b;
            -webkit-transform: rotateY(180deg);
            transform: rotateY(180deg);
            z-index: 1;
        }

        .hanzi {
            font-size: 4.5em;
            color: #000000;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'KaiTi', 'SimSun', 'Microsoft YaHei', 'STKaiti', serif;
            text-align: center;
            line-height: 1.3;
        }

        .card-back-content {
            text-align: center;
            color: #fbbf24;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .pinyin {
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 500;
            color: #93c5fd;
        }

        .part-of-speech {
            font-size: 1.2em;
            margin-bottom: 10px;
            opacity: 0.9;
            color: #cbd5e1;
        }

        .translation {
            font-size: 1.4em;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .collocations {
            font-size: 1em;
            color: #a5b4fc;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 92%;
            line-height: 1.6;
            border-left: 3px solid #fbbf24;
            text-align: left;
        }

        .collocations-label {
            font-size: 0.75em;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .navigation {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .completion-screen {
            display: none;
            text-align: center;
            color: white;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .completion-screen h2 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .completion-screen p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .hint {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .card {
                height: 380px;
            }

            .hanzi {
                font-size: 3.5em;
            }

            .pinyin {
                font-size: 1.4em;
            }

            .translation {
                font-size: 1.1em;
            }

            .collocations {
                font-size: 0.85em;
                padding: 10px 12px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.85em;
            }

            .header h1 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇨🇳 HSK5 — 阅读(1)</h1>
            <div class="counter" id="counter">Карточка 1 из 1</div>
        </div>

        <div id="cardView">
            <div class="card-container">
                <div class="card" id="flashcard">
                    <div class="card-face card-front">
                        <div class="hanzi" id="hanzi"></div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-back-content">
                            <div class="pinyin" id="pinyin"></div>
                            <div class="part-of-speech" id="partOfSpeech"></div>
                            <div class="translation" id="translation"></div>
                            <div class="collocations">
                                <div class="collocations-label">📌 配合词</div>
                                <div id="collocations"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hint">💡 Нажмите на карточку, чтобы перевернуть</div>

            <div class="controls">
                <button class="btn btn-warning" onclick="shuffleCards()">🔀 Перемешать</button>
                <button class="btn btn-success" onclick="markAsLearned()">✓ Запомнил</button>
            </div>

            <div class="navigation">
                <button class="btn btn-primary" onclick="previousCard()">← Назад</button>
                <button class="btn btn-primary" onclick="nextCard()">Вперед →</button>
            </div>
        </div>

        <div class="completion-screen" id="completionScreen">
            <h2>🎉 恭喜！</h2>
            <p>Вы изучили все карточки!</p>
            <button class="btn btn-primary" onclick="resetCards()">🔄 Начать заново</button>
        </div>
    </div>

    <script>
        const cardsData = [
            { hanzi: '流逝', pinyin: 'liúshì', pos: '', translation: 'проходить, утекать', collocations: '时光流逝；岁月流逝；青春流逝' },
            { hanzi: '陈旧', pinyin: 'chénjiù', pos: '', translation: 'старый, устаревший', collocations: '建筑陈旧；房屋陈旧；家具陈旧' },
            { hanzi: '工艺', pinyin: 'gōngyì', pos: '', translation: 'технология изготовления, ремесло', collocations: '建筑工艺；手工工艺；精湛工艺' },
            { hanzi: '精美', pinyin: 'jīngměi', pos: '', translation: 'изящный, искусно сделанный', collocations: '工艺精美；雕刻精美；精美建筑' },
            { hanzi: '征求', pinyin: 'zhēngqiú', pos: '', translation: 'спрашивать, запрашивать мнение', collocations: '征求意见；征求建议' },
            { hanzi: '争取', pinyin: 'zhēngqǔ', pos: '', translation: 'стараться добиться', collocations: '争取时间；争取机会；争取高分' },
            { hanzi: '收获', pinyin: 'shōuhuò', pos: '', translation: 'приобретение, результат; получить', collocations: '巨大收获；意外收获；收获知识' },
            { hanzi: '广大', pinyin: 'guǎngdà', pos: '', translation: 'обширный, широкий', collocations: '广大地区；广大群众；广大用户' },
            { hanzi: '必然', pinyin: 'bìrán', pos: '', translation: 'неизбежный; обязательно', collocations: '必然结果；必然发生' },
            { hanzi: '艰巨', pinyin: 'jiānjù', pos: '', translation: 'трудный, тяжёлый', collocations: '艰巨的任务；艰巨工作' },
            { hanzi: '必要', pinyin: 'bìyào', pos: '', translation: 'необходимый', collocations: '必要条件；必要的休息；十分必要' },
            { hanzi: '记忆', pinyin: 'jìyì', pos: '', translation: 'память, воспоминание', collocations: '形成记忆；难忘的记忆；童年的记忆' },
            { hanzi: '力量', pinyin: 'lìliàng', pos: '', translation: 'сила', collocations: '精神力量；强大力量；力量不足' },
            { hanzi: '爱心', pinyin: 'àixīn', pos: '', translation: 'любовь, забота о других', collocations: '富有爱心；献出爱心；充满爱心' },
            { hanzi: '个性', pinyin: 'gèxìng', pos: '', translation: 'индивидуальность, характер', collocations: '个性鲜明；个人个性；独特个性' },
            { hanzi: '细心', pinyin: 'xìxīn', pos: '', translation: 'внимательный, тщательный', collocations: '细心观察；做事细心；考试时要细心' },
            { hanzi: '不利', pinyin: 'bùlì', pos: '', translation: 'неблагоприятный', collocations: '对健康不利；不利条件；十分不利；反义词：有利' },
            { hanzi: '有利', pinyin: 'yǒulì', pos: '', translation: 'благоприятный, выгодный', collocations: '有利条件；有利环境；有利因素；反义词：不利' },
            { hanzi: '心态', pinyin: 'xīntài', pos: '', translation: 'психологический настрой', collocations: '调整心态；放平心态；良好心态' },
            { hanzi: '关键', pinyin: 'guānjiàn', pos: '', translation: 'ключевой, решающий; ключ', collocations: '关键问题；关键因素；抓住关键' },
            { hanzi: '情绪', pinyin: 'qíngxù', pos: '', translation: 'эмоции, настроение', collocations: '情绪稳定；控制情绪；紧张的情绪' },
            { hanzi: '判断力', pinyin: 'pànduànlì', pos: '', translation: 'способность здраво судить', collocations: '影响判断力；提升判断力；失去判断力' },
            { hanzi: '积极', pinyin: 'jījí', pos: '', translation: 'активный, положительный', collocations: '积极学习；积极态度；积极行动；反义词：消极' },
            { hanzi: '临近', pinyin: 'línjìn', pos: '', translation: 'приближаться, быть близко', collocations: '临近考试；临近期末；临近车站' },
            { hanzi: '临阵磨枪', pinyin: 'línzhèn-móqiāng', pos: '', translation: 'готовиться в последний момент', collocations: '临阵磨枪；考试前临阵磨枪' },
            { hanzi: '通宵', pinyin: 'tōngxiāo', pos: '', translation: 'всю ночь, не спать всю ночь', collocations: '通宵学习；通宵复习；通宵熬夜' },
            { hanzi: '功课', pinyin: 'gōngkè', pos: '', translation: 'учёба, уроки, домашняя работа', collocations: '复习功课；做完功课；所有功课' },
            { hanzi: '做法', pinyin: 'zuòfǎ', pos: '', translation: 'способ действий, подход', collocations: '这种做法；错误做法；正确做法' },
            { hanzi: '可取', pinyin: 'kěqǔ', pos: '', translation: 'заслуживающий одобрения, разумный', collocations: '做法可取；十分可取；并不可取' },
            { hanzi: '提供', pinyin: 'tígōng', pos: '', translation: 'предоставлять', collocations: '提供帮助；提供资源；提供条件' },
            { hanzi: '转化', pinyin: 'zhuǎnhuà', pos: '', translation: 'превращать, преобразовывать', collocations: '转化成记忆；转化能量；转化成果' },
            { hanzi: '注意力', pinyin: 'zhùyìlì', pos: '', translation: 'внимание, концентрация', collocations: '集中注意力；分散注意力' },
            { hanzi: '下降', pinyin: 'xiàjiàng', pos: '', translation: 'снижаться, падать', collocations: '成绩下降；质量下降；注意力下降；反义词：上升；提高' },
            { hanzi: '保证', pinyin: 'bǎozhèng', pos: '', translation: 'гарантировать, обеспечивать', collocations: '保证睡眠；保证质量；保证时间' },
            { hanzi: '充足', pinyin: 'chōngzú', pos: '', translation: 'достаточный, в достатке', collocations: '充足的睡眠；时间充足；准备充足' }
        ];

        let cards = [...cardsData];
        let currentIndex = 0;
        let isFlipped = false;

        const flashcard = document.getElementById('flashcard');
        const hanziEl = document.getElementById('hanzi');
        const pinyinEl = document.getElementById('pinyin');
        const partOfSpeechEl = document.getElementById('partOfSpeech');
        const translationEl = document.getElementById('translation');
        const collocationsEl = document.getElementById('collocations');
        const counterEl = document.getElementById('counter');
        const cardView = document.getElementById('cardView');
        const completionScreen = document.getElementById('completionScreen');

        // ===== ГЛАВНОЕ: переворот через style.transform =====
        function flipCard() {
            if (isFlipped) {
                flashcard.style.webkitTransform = 'rotateY(0deg)';
                flashcard.style.transform = 'rotateY(0deg)';
                isFlipped = false;
            } else {
                flashcard.style.webkitTransform = 'rotateY(180deg)';
                flashcard.style.transform = 'rotateY(180deg)';
                isFlipped = true;
            }
        }

        // Клик по карточке
        flashcard.addEventListener('click', flipCard);

        function updateCard() {
            if (cards.length === 0) {
                showCompletionScreen();
                return;
            }

            const card = cards[currentIndex];
            hanziEl.textContent = card.hanzi;
            pinyinEl.textContent = card.pinyin;
            partOfSpeechEl.textContent = card.pos;
            translationEl.textContent = card.translation;
            collocationsEl.textContent = card.collocations || '—';

            // Всегда сбрасываем на лицевую сторону при смене карточки
            flashcard.style.webkitTransform = 'rotateY(0deg)';
            flashcard.style.transform = 'rotateY(0deg)';
            isFlipped = false;

            updateCounter();
        }

        function updateCounter() {
            counterEl.textContent = 'Карточка ' + (currentIndex + 1) + ' из ' + cards.length;
        }

        function nextCard() {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function markAsLearned() {
            if (cards.length === 0) return;

            cards.splice(currentIndex, 1);

            if (cards.length === 0) {
                showCompletionScreen();
            } else {
                if (currentIndex >= cards.length) {
                    currentIndex = cards.length - 1;
                }
                updateCard();
            }
        }

        function showCompletionScreen() {
            cardView.style.display = 'none';
            completionScreen.style.display = 'block';
        }

        function resetCards() {
            cards = cardsData.map(c => ({ ...c }));
            currentIndex = 0;
            cardView.style.display = 'block';
            completionScreen.style.display = 'none';
            updateCard();
        }

        // Клавиши
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === ' ') {
                e.preventDefault();
                flipCard();
            }
        });

        updateCard();
    </script>
</body>
</html>
