<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK5 — 阅读（1）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .counter {
            font-size: 1.2em;
            margin-top: 10px;
            opacity: 0.9;
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            width: 100%;
            height: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-front {
            background: white;
        }

        .card-back {
            background: #1e293b;
            transform: rotateY(180deg);
        }

        .hanzi {
            font-size: 4.5em;
            color: #000000;
            font-weight: bold;
            margin-bottom: 10px;
            font-family: 'KaiTi', 'SimSun', 'Microsoft YaHei', 'STKaiti', serif;
            text-align: center;
            line-height: 1.3;
        }

        .card-back-content {
            text-align: center;
            color: #fbbf24;
            width: 100%;
        }

        .pinyin {
            font-size: 1.8em;
            margin-bottom: 10px;
            font-weight: 500;
            color: #93c5fd;
        }

        .part-of-speech {
            font-size: 1.2em;
            margin-bottom: 12px;
            opacity: 0.9;
            color: #cbd5e1;
        }

        .translation {
            font-size: 1.4em;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .usage {
            font-size: 1em;
            color: #a5b4fc;
            background: rgba(255,255,255,0.08);
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 90%;
            line-height: 1.6;
            border-left: 3px solid #fbbf24;
            text-align: left;
        }

        .usage-label {
            font-size: 0.8em;
            color: #94a3b8;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .navigation {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .completion-screen {
            display: none;
            text-align: center;
            color: white;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .completion-screen h2 {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .completion-screen p {
            font-size: 1.5em;
            margin-bottom: 30px;
        }

        .hint {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            .card {
                height: 380px;
            }

            .hanzi {
                font-size: 3.5em;
            }

            .pinyin {
                font-size: 1.4em;
            }

            .translation {
                font-size: 1.1em;
            }

            .usage {
                font-size: 0.85em;
                padding: 10px 12px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.85em;
            }

            .header h1 {
                font-size: 1.4em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇨🇳 HSK5 — 阅读（1）</h1>
            <div class="counter" id="counter">Карточка 1 из 71</div>
        </div>

        <div id="cardView">
            <div class="card-container">
                <div class="card" id="flashcard">
                    <div class="card-face card-front">
                        <div class="hanzi" id="hanzi">生动</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-back-content">
                            <div class="pinyin" id="pinyin">shēngdòng</div>
                            <div class="part-of-speech" id="partOfSpeech">прилагательное</div>
                            <div class="translation" id="translation">живой, яркий (образный)</div>
                            <div class="usage">
                                <div class="usage-label">📌 Примеры</div>
                                <div id="usage">生动的画面、生动形象、描写生动</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hint">💡 Нажмите на карточку, чтобы перевернуть</div>

            <div class="controls">
                <button class="btn btn-warning" onclick="shuffleCards()">🔀 Перемешать</button>
                <button class="btn btn-success" onclick="markAsLearned()">✓ Запомнил</button>
            </div>

            <div class="navigation">
                <button class="btn btn-primary" onclick="previousCard()">← Назад</button>
                <button class="btn btn-primary" onclick="nextCard()">Вперед →</button>
            </div>
        </div>

        <div class="completion-screen" id="completionScreen">
            <h2>🎉 恭喜！</h2>
            <p>Вы изучили все карточки!</p>
            <button class="btn btn-primary" onclick="resetCards()">🔄 Начать заново</button>
        </div>
    </div>

    <script>
        const cardsData = [
            // ===== ОСНОВНАЯ ЛЕКСИКА =====
            { hanzi: '生动', pinyin: 'shēngdòng', pos: 'прилагательное', translation: 'живой, яркий (образный)', usage: '生动的画面、生动形象、描写生动' },
            { hanzi: '动听', pinyin: 'dòngtīng', pos: 'прилагательное', translation: 'приятный для слуха (о музыке/голосе)', usage: '动听的音乐、声音动听' },
            { hanzi: '幸运', pinyin: 'xìngyùn', pos: 'прилагательное', translation: 'удачливый, счастливый', usage: '幸运的人、十分幸运、幸运中奖' },
            { hanzi: '发达', pinyin: 'fādá', pos: 'прилагательное', translation: 'развитой (об экономике/мышцах/транспорте)', usage: '经济发达、肌肉发达、交通发达' },
            { hanzi: '周到', pinyin: 'zhōudào', pos: 'прилагательное', translation: 'внимательный, всесторонний', usage: '服务周到、考虑周到、安排周到' },
            { hanzi: '流传', pinyin: 'liúchuán', pos: 'глагол', translation: 'передаваться (из уст в уста, из поколения в поколение)', usage: '流传至今、广为流传、民间流传' },
            { hanzi: '朗读', pinyin: 'lǎngdú', pos: 'глагол', translation: 'читать вслух', usage: '朗读课文、大声朗读' },
            { hanzi: '叙述', pinyin: 'xùshù', pos: 'глагол', translation: 'повествовать, излагать', usage: '叙述故事、详细叙述' },
            { hanzi: '浏览', pinyin: 'liúlǎn', pos: 'глагол', translation: 'просматривать (бегло)', usage: '浏览网页、快速浏览' },
            { hanzi: '面临', pinyin: 'miànlín', pos: 'глагол', translation: 'сталкиваться (с трудностями)', usage: '面临困境、面临挑战、面临难题' },
            { hanzi: '强调', pinyin: 'qiángdiào', pos: 'глагол', translation: 'подчёркивать, акцентировать', usage: '强调重点、强调安全' },
            { hanzi: '配合', pinyin: 'pèihé', pos: 'глагол', translation: 'сотрудничать, координировать', usage: '互相配合、配合工作' },
            { hanzi: '促使', pinyin: 'cùshǐ', pos: 'глагол', translation: 'побуждать, способствовать', usage: '促使进步、促使改变' },
            { hanzi: '标志', pinyin: 'biāozhì', pos: 'существительное', translation: 'символ, знак', usage: '文化标志、时代标志、标志性建筑' },
            { hanzi: '角度', pinyin: 'jiǎodù', pos: 'существительное', translation: 'угол зрения, точка зрения', usage: '从不同角度思考' },
            { hanzi: '状态', pinyin: 'zhuàngtài', pos: 'существительное', translation: 'состояние, положение', usage: '生活状态、工作状态' },
            { hanzi: '原则', pinyin: 'yuánzé', pos: 'существительное', translation: 'принцип', usage: '基本原则、遵守原则' },
            { hanzi: '措施', pinyin: 'cuòshī', pos: 'существительное', translation: 'меры, мероприятия', usage: '采取措施、出台措施、相应措施' },
            { hanzi: '记忆', pinyin: 'jìyì', pos: 'существительное', translation: 'память, воспоминания', usage: '增强记忆、转化成记忆' },
            { hanzi: '必要', pinyin: 'bìyào', pos: 'прилагательное', translation: 'необходимый, обязательный', usage: '必要的休息、必要条件' },
            { hanzi: '直观', pinyin: 'zhíguān', pos: 'прилагательное', translation: 'наглядный, непосредственно воспринимаемый', usage: '直观感受、直观印象' },
            { hanzi: '过剩', pinyin: 'guòshèng', pos: 'прилагательное/существительное', translation: 'избыток, чрезмерный', usage: '反义词：匮乏' },

            // ===== СОЮЗЫ И СЛУЖЕБНЫЕ СЛОВА =====
            { hanzi: '与其', pinyin: 'yǔqí', pos: 'союз', translation: 'чем (в конструкции выбора)', usage: '与其……不如……，与其……宁可……' },
            { hanzi: '除非', pinyin: 'chúfēi', pos: 'союз', translation: 'если только не (единственное условие)', usage: '除非……才……，除非……否则……' },
            { hanzi: '因而', pinyin: 'yīn'ér', pos: 'союз', translation: 'поэтому, следовательно', usage: '表因果，同"因此、所以"' },
            { hanzi: '宁可', pinyin: 'nìngkě', pos: 'наречие', translation: 'лучше (сознательный выбор)', usage: '宁可……也不……' },
            { hanzi: '不但', pinyin: 'bùdàn', pos: 'союз', translation: 'не только', usage: '不但……而且……' },
            { hanzi: '至于', pinyin: 'zhìyú', pos: 'предлог/глагол', translation: 'что касается; достигать степени', usage: '①至于时间②至于生那么大气吗？' },
            { hanzi: '无论', pinyin: 'wúlùn', pos: 'союз', translation: 'независимо от', usage: '无论……都……' },

            // ===== НАРЕЧИЯ (ключевые) =====
            { hanzi: '再三', pinyin: 'zàisān', pos: 'наречие', translation: 'неоднократно, много раз', usage: '再三强调、再三考虑、再三叮嘱' },
            { hanzi: '反复', pinyin: 'fǎnfù', pos: 'наречие/глагол', translation: 'многократно, циклично', usage: '反复练习、反复思考、病情反复' },
            { hanzi: '重新', pinyin: 'chóngxīn', pos: 'наречие', translation: 'заново, с нуля', usage: '重新开始、重新考虑、重新开通' },
            { hanzi: '原则上', pinyin: 'yuánzéshàng', pos: 'наречие', translation: 'в принципе (формально, но с исключениями)', usage: '原则上不可以 = формально нельзя, но есть исключения' },

            // ===== ГРУППА «СОСТАВЛЯТЬ» =====
            { hanzi: '构成', pinyin: 'gòuchéng', pos: 'глагол', translation: 'составлять (абстрактное целое)', usage: '构成整体、构成威胁、构成犯罪' },
            { hanzi: '组成', pinyin: 'zǔchéng', pos: 'глагол', translation: 'состоять из (коллектив/группа/части)', usage: '组成小组、组成团队、组成部分' },
            { hanzi: '形成', pinyin: 'xíngchéng', pos: 'глагол', translation: 'формироваться (постепенно)', usage: '形成习惯、自然形成、慢慢形成' },

            // ===== ГРУППА «ПРИНИМАТЬ / ИСПОЛЬЗОВАТЬ» =====
            { hanzi: '采取', pinyin: 'cǎiqǔ', pos: 'глагол', translation: 'принимать (меры/решения/политику)', usage: '采取措施、采取行动、采取积极态度' },
            { hanzi: '采用', pinyin: 'cǎiyòng', pos: 'глагол', translation: 'использовать, применять (метод/технологию)', usage: '采用新技术、采用方案' },

            // ===== СЧЁТНЫЕ СЛОВА =====
            { hanzi: '堆', pinyin: 'duī', pos: 'сч. слово / глагол / сущ.', translation: 'куча / сваливать', usage: '一堆土、堆在一起、石头堆' },
            { hanzi: '项', pinyin: 'xiàng', pos: 'счётное слово', translation: 'для проектов, культурных объектов', usage: '一项文化、一项任务、一项研究' },
            { hanzi: '片', pinyin: 'piàn', pos: 'сч. слово / сущ.', translation: 'для плоских предметов / звуков', usage: '一片面包、一片海、一片欢呼声' },
            { hanzi: '所', pinyin: 'suǒ', pos: 'счётное слово', translation: 'для зданий / учреждений', usage: '一所学校、一所医院' },

            // ===== СЛОВА ИЗ ЗАДАНИЙ =====
            { hanzi: '划', pinyin: 'huà', pos: 'глагол', translation: 'охватить маршрутом, проехать по точкам', usage: '划遍建水 = проехать по всему городу' },
            { hanzi: '争取', pinyin: 'zhēngqǔ', pos: 'глагол', translation: 'добиваться, стараться получить', usage: '争取时间、争取复习一遍' },
            { hanzi: '出台', pinyin: 'chūtái', pos: 'глагол', translation: 'вводить (официально, о законах/мерах)', usage: '出台措施、出台政策' },
            { hanzi: '相应', pinyin: 'xiāngyìng', pos: 'прилагательное', translation: 'соответствующий', usage: '相应措施、相应调整' },

            // ===== ФРАЗЕОЛОГИЗМЫ И ВЫРАЖЕНИЯ =====
            { hanzi: '顾名思义', pinyin: 'gùmíngsīyì', pos: 'фразеологизм', translation: 'как следует из названия', usage: '从名称就能明白含义' },
            { hanzi: '临阵磨枪', pinyin: 'línzhèn móqiāng', pos: 'фразеологизм', translation: 'готовиться в последний момент', usage: '临阵磨枪，不快也光' },
            { hanzi: '通宵', pinyin: 'tōngxiāo', pos: 'существительное/наречие', translation: 'всю ночь', usage: '通宵学习、通宵达旦' },
            { hanzi: '临近期末', pinyin: 'línjìn qīmò', pos: 'выражение', translation: 'близится конец семестра', usage: '临近期末，大家都很忙' },
            { hanzi: '充足的睡眠', pinyin: 'chōngzú de shuìmián', pos: 'выражение', translation: 'достаточный сон', usage: '保证充足的睡眠' },
            { hanzi: '注意力', pinyin: 'zhùyìlì', pos: 'существительное', translation: 'внимание, концентрация', usage: '注意力下降、集中注意力' },

            // ===== СЛОВА ДЛЯ КОНТЕКСТА (из текстов) =====
            { hanzi: '伴奏', pinyin: 'bànzòu', pos: 'глагол/существительное', translation: 'аккомпанировать / аккомпанемент', usage: '现场伴奏、为……伴奏' },
            { hanzi: '失传', pinyin: 'shīchuán', pos: 'глагол', translation: 'быть утерянным (о традициях/знаниях)', usage: '技艺失传、失传已久' },

            // ===== РАБОТА НАД ОШИБКАМИ =====
            { hanzi: '改错', pinyin: 'gǎicuò', pos: 'глагол', translation: 'исправлять ошибки', usage: '改错题、改错练习' },
            { hanzi: '错题分析', pinyin: 'cuòtí fēnxī', pos: 'существительное', translation: 'анализ ошибочных заданий', usage: '做错题分析、错题分析很重要' },
            { hanzi: '订正', pinyin: 'dìngzhèng', pos: 'глагол', translation: 'переписывать правильно (в тетради)', usage: '订正三遍、订正错误' },

            // ===== ДОПОЛНИТЕЛЬНЫЕ СЛОВА ИЗ ФАЙЛА =====
            { hanzi: '核心', pinyin: 'héxīn', pos: 'существительное', translation: 'ядро, сердцевина, основная часть', usage: '核心问题、核心人物' },
            { hanzi: '因素', pinyin: 'yīnsù', pos: 'существительное', translation: 'фактор, элемент', usage: '关键因素、重要因素' },
            { hanzi: '内部', pinyin: 'nèibù', pos: 'существительное/прилагательное', translation: 'внутренний, внутри', usage: '内部消息、内部结构' },
            { hanzi: '当地', pinyin: 'dāngdì', pos: 'прилагательное/существительное', translation: 'местный, на месте', usage: '当地居民、当地文化' },
            { hanzi: '追', pinyin: 'zhuī', pos: 'глагол', translation: 'преследовать, догонять', usage: '追火车、追求、追赶' },
            { hanzi: '冲', pinyin: 'chōng', pos: 'глагол', translation: 'мчаться, устремляться', usage: '冲过去、冲刺、冲动' },
        ];

        let cards = [...cardsData];
        let currentIndex = 0;
        let isFlipped = false;

        const flashcard = document.getElementById('flashcard');
        const hanziEl = document.getElementById('hanzi');
        const pinyinEl = document.getElementById('pinyin');
        const partOfSpeechEl = document.getElementById('partOfSpeech');
        const translationEl = document.getElementById('translation');
        const usageEl = document.getElementById('usage');
        const counterEl = document.getElementById('counter');
        const cardView = document.getElementById('cardView');
        const completionScreen = document.getElementById('completionScreen');

        flashcard.addEventListener('click', flipCard);

        function flipCard() {
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function updateCard() {
            if (cards.length === 0) {
                showCompletionScreen();
                return;
            }

            const card = cards[currentIndex];
            hanziEl.textContent = card.hanzi;
            pinyinEl.textContent = card.pinyin;
            partOfSpeechEl.textContent = card.pos;
            translationEl.textContent = card.translation;
            usageEl.textContent = card.usage || '—';
            
            if (isFlipped) {
                flashcard.classList.remove('flipped');
                isFlipped = false;
            }

            updateCounter();
        }

        function updateCounter() {
            counterEl.textContent = `Карточка ${currentIndex + 1} из ${cards.length}`;
        }

        function nextCard() {
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function markAsLearned() {
            if (cards.length === 0) return;
            
            cards.splice(currentIndex, 1);
            
            if (cards.length === 0) {
                showCompletionScreen();
            } else {
                if (currentIndex >= cards.length) {
                    currentIndex = cards.length - 1;
                }
                updateCard();
            }
        }

        function showCompletionScreen() {
            cardView.style.display = 'none';
            completionScreen.style.display = 'block';
        }

        function resetCards() {
            cards = [...cardsData];
            currentIndex = 0;
            cardView.style.display = 'block';
            completionScreen.style.display = 'none';
            updateCard();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousCard();
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === ' ') {
                e.preventDefault();
                flipCard();
            }
        });

        updateCard();
    </script>
</body>
</html>
